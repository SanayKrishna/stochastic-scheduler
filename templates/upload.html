{% extends "base.html" %}
{% block content %}
<h1>Check if your deadline survives contact with reality.</h1>
<p class="sub">Drop in three-point estimates. We run 10,000 PERT Monte Carlos and show where the schedule actually lands.</p>

{% if error %}<div class="err">{{ error }}</div>{% endif %}

<form id="simform" class="card" method="post" action="/analyze" enctype="multipart/form-data">
  <div class="seg" role="tablist">
    <button type="button" id="tab-file" class="on">File</button>
    <button type="button" id="tab-paste">Paste JSON</button>
  </div>

  <div id="pane-file">
    <label class="drop" id="drop">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0D7377" stroke-width="1.8"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/></svg>
      <div>
        <strong id="drop-label">Drop input.json here</strong>
        <span>or click to browse. Must match the expected schema.</span>
      </div>
      <input type="file" id="file" name="file" accept=".json,application/json">
    </label>
  </div>

  <div id="pane-paste" hidden>
    <textarea class="json" name="json_text" id="json_text" spellcheck="false" placeholder='{"project_name": "...", "tasks": [...]}'></textarea>
  </div>

  <div class="row">
    <div class="field">
      <label for="simulations">Simulations</label>
      <input id="simulations" name="simulations" type="number" value="10000" min="1000" max="50000" step="1000">
    </div>
    <div>
      <button class="btn" id="runbtn" type="submit"><span class="spin"></span><span id="runlabel">Run Simulation</span></button>
    </div>
  </div>

  <details class="ex">
    <summary>See example JSON</summary>
    <pre>{{ example }}</pre>
  </details>
</form>

<script>
const tabFile = document.getElementById('tab-file');
const tabPaste = document.getElementById('tab-paste');
const paneFile = document.getElementById('pane-file');
const panePaste = document.getElementById('pane-paste');
tabFile.onclick = () => { tabFile.classList.add('on'); tabPaste.classList.remove('on'); paneFile.hidden = false; panePaste.hidden = true; };
tabPaste.onclick = () => { tabPaste.classList.add('on'); tabFile.classList.remove('on'); panePaste.hidden = false; paneFile.hidden = true; };

const drop = document.getElementById('drop');
const file = document.getElementById('file');
const label = document.getElementById('drop-label');
drop.addEventListener('click', (e) => { if (e.target.tagName !== 'INPUT') file.click(); });
['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => {
  if (e.dataTransfer.files.length) { file.files = e.dataTransfer.files; label.textContent = e.dataTransfer.files[0].name; }
});
file.addEventListener('change', () => { if (file.files.length) label.textContent = file.files[0].name; });

document.getElementById('simform').addEventListener('submit', () => {
  const btn = document.getElementById('runbtn');
  btn.disabled = true; btn.classList.add('loading');
  document.getElementById('runlabel').textContent = 'Running simulation…';
});
</script>
{% endblock %}
